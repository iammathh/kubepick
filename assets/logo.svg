<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">kubepick</title>
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="64" y1="6" x2="64" y2="124"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="12" y1="6" x2="116" y2="124"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="dot" gradientUnits="userSpaceOnUse" x1="52" y1="66" x2="76" y2="90"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#ffb703"/></linearGradient>
  </defs>
  <!-- the pick -->
  <path d="M64 6C98 6 118 22 118 50C118 84 88 112 64 124C40 112 10 84 10 50C10 22 30 6 64 6Z" fill="url(#fill)" stroke="url(#edge)" stroke-width="4" stroke-linejoin="round"/>
