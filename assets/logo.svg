  <path d="M46 44H82M46 44L64 78M82 44L64 78" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="44" r="7" fill="url(#fill)" stroke="#fff" stroke-width="3"/>
  <circle cx="82" cy="44" r="7" fill="url(#fill)" stroke="#fff" stroke-width="3"/>
  <!-- the one you picked -->
  <circle cx="64" cy="78" r="12" fill="url(#dot)"/>
  <path d="M58.5 78.5l4.2 4.2L70 73.5" fill="none" stroke="#14161c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
